<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventLoop: Async Event Discovery in the 312</title>
    <link rel="stylesheet" href="/src/input.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        body {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 0;
            background: #f5f5f5;
        }
        @media (max-width: 1200px) {
            body {
                grid-template-columns: 1fr;
            }
            #chat-widget-container {
                display: none;
            }
        }
        #app {
            background: white;
            overflow-y: auto;
        }
        #chat-widget-container {
            border-left: 1px solid #e5e7eb;
            background: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #chat-widget {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .chat-header {
            padding: 16px;
            border-bottom: 1px solid #e5e7eb;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
            color: white;
        }
        .chat-header h2 {
            margin: 0;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chat-message {
            display: flex;
            gap: 8px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-avatar {
            font-size: 20px;
            flex-shrink: 0;
        }
        .chat-content {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .chat-message-user .chat-content {
            background: #e0f2fe;
            color: #0c4a6e;
        }
        .chat-message-assistant .chat-content {
            background: #f3f4f6;
            color: #1f2937;
        }
        .chat-message-error .chat-content {
            background: #fee2e2;
            color: #991b1b;
        }
        .chat-status {
            padding: 8px 12px;
            background: #fef3c7;
            border-left: 3px solid #f59e0b;
            font-size: 13px;
            color: #92400e;
            border-radius: 4px;
            animation: slideIn 0.2s ease;
        }
        .chat-input-area {
            padding: 12px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 8px;
            background: white;
        }
        .chat-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 100px;
        }
        .chat-input:focus {
            outline: none;
            border-color: #0ea5e9;
            box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.1);
        }
        .chat-send, .chat-new {
            padding: 10px 16px;
            background: #0ea5e9;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .chat-send:hover, .chat-new:hover {
            background: #0284c7;
        }
        .chat-send:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }
        .chat-new {
            display: none;
            background: #10b981;
        }
        .chat-new:hover {
            background: #059669;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <div id="chat-widget-container">
        <div class="chat-header">
            <h2>⚡ EventLoop</h2>
        </div>
        <div id="chat-widget">
            <div class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" placeholder="Ask about events..." />
                <button class="chat-send">Send</button>
                <button class="chat-new">New Chat</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>

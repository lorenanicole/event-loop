server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api/* requests to the backend API service at runtime.
    # ${API_URL} is substituted by envsubst when the container starts.
    # This avoids baking the backend URL into the JS bundle at build time.
    location /api/ {
        proxy_pass ${API_URL}/api/;
        proxy_set_header Host event-loop-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback — all unknown paths serve index.html so client-side
    # routing works without 404s on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets aggressively; index.html never cached.
    location ~* \.(?:js|css|svg|png|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

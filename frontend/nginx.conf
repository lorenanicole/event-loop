server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all unknown paths serve index.html so client-side
    # routing works without 404s on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets aggressively; index.html never cached.
    location ~* \.(?:js|css|svg|png|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Loopara">
  <!--
    Loopara: a six-pointed Chicago star inside an open loop.

    Six points, not five - the five-pointed star is generic, the six-pointed one
    is the Chicago flag's. Red is the flag's star colour (Pantone 186); the ring
    is the flag's light blue (Pantone 298) and is deliberately left open, so it
    reads as a loop still running rather than a closed circle.
  -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#41B6E6" stroke-width="2.5"
          stroke-linecap="round" stroke-dasharray="248 41" transform="rotate(-100 50 50)"/>

  <!-- The leading end of the loop, like a cursor still travelling round it -->
  <circle cx="50" cy="4" r="4" fill="#41B6E6"/>

  <path d="M50,18 L59.3,34 L77.7,34 L68.5,50 L77.7,66 L59.3,66 L50,82
           L40.7,66 L22.3,66 L31.5,50 L22.3,34 L40.7,34 Z" fill="#C8102E"/>
</svg>

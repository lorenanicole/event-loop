<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer glow -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.3"/>

  <!-- Main body - cute round character -->
  <circle cx="50" cy="50" r="38" fill="#0ea5e9"/>

  <!-- Spiral loop pattern inside -->
  <path d="M 50 20 Q 65 35 65 50 Q 65 65 50 75" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M 50 20 Q 35 35 35 50 Q 35 65 50 75" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Eyes - cute and expressive -->
  <circle cx="40" cy="42" r="4" fill="#ffffff"/>
  <circle cx="60" cy="42" r="4" fill="#ffffff"/>
  <circle cx="41" cy="41" r="2" fill="#0f172a"/>
  <circle cx="61" cy="41" r="2" fill="#0f172a"/>

  <!-- Smile -->
  <path d="M 40 55 Q 50 62 60 55" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Sparkles around the character -->
  <circle cx="75" cy="35" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="25" cy="35" r="2.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="70" cy="65" r="2" fill="#fbbf24" opacity="0.7"/>

  <!-- Twinkle stars -->
  <path d="M 80 30 L 82 32 L 80 34 L 78 32 Z" fill="#fbbf24" opacity="0.7"/>
  <path d="M 22 65 L 23 66 L 22 67 L 21 66 Z" fill="#fbbf24" opacity="0.5"/>
</svg>
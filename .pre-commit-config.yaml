# Pre-commit git hooks configuration
# Runs automatically on 'git commit'
# Install with: invoke setup-hooks

repos:
  # Ruff linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix]
        name: "Ruff lint (auto-fix)"

  # Ruff formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-format
        name: "Ruff format"

  # Trailing whitespace
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: "Trim trailing whitespace"

      - id: end-of-file-fixer
        name: "Fix end-of-file"

      - id: check-yaml
        name: "Check YAML syntax"
        args: [--safe]

      - id: check-toml
        name: "Check TOML syntax"

      - id: debug-statements
        name: "Check for debug statements"

  # Python security
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        name: "Security check (Bandit)"
        # -r backend/src, not src/: the latter has not existed since the
        # project moved, so this was scanning nothing.
        args: [-c, .bandit, -r, backend/src]
        types: [python]
        # bandit 1.7.5 imports pbr at startup and does not declare it in a way
        # pre-commit's isolated env picks up under Python 3.15, so every run
        # died with ModuleNotFoundError before scanning a line.
        additional_dependencies: [pbr]

  # Core tests (security + core functionality)
  - repo: local
    hooks:
      - id: pytest-security
        name: "Security tests"
        entry: bash -c 'cd backend && PYTHONPATH=src .venv/bin/python -m pytest tests/app/test_security.py -q'
        language: system
        types: [python]
        stages: [pre-commit]
        pass_filenames: false

      - id: pytest-core
        name: "Core functionality tests"
        entry: bash -c 'cd backend && PYTHONPATH=src .venv/bin/python -m pytest tests/app/test_resilience.py tests/app/test_chatbot.py -q'
        language: system
        types: [python]
        stages: [pre-commit]
        pass_filenames: false

# Configuration
default_language_version:
  python: python3.15

# Only run on these files (speed up for large repos)
files: ^(backend/src/|backend/tests/|tasks\.py)

# `stages` and `verbose` were here as top-level keys, which pre-commit does
# not accept there - it warned "Unexpected key(s) present at root" on every
# single commit. They are per-hook settings, and nothing here needs them.

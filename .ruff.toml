# Ruff configuration for Python 3.15 project
# Fast, modern linter and formatter

[tool.ruff]
# Python 3.15
target-version = "py315"
line-length = 100

# Lint rules
[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C90",    # mccabe (complexity)
    "C4",     # flake8-comprehensions
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]

ignore = [
    "E501",   # Line too long (we handle this with line-length)
    "W503",   # Line break before binary operator
    "N806",   # Variable in function should be lowercase (for type hints)
]

# McCabe complexity threshold
[tool.ruff.lint.mccabe]
max-complexity = 10

# isort configuration (import sorting)
[tool.ruff.lint.isort]
known-first-party = ["src"]
known-third-party = ["pydantic", "fastapi", "sqlalchemy"]

# Exclude patterns
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    ".pytest_cache",
    "node_modules",
]

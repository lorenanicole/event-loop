[project]
name = "do312-scraper"
version = "0.1.0"
description = "Event discovery platform that scrapes DO312, normalizes data, and provides natural language search via FastAPI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.8.0",
    "pydantic-ai>=0.1.0",
    "anthropic>=0.45.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "anyio>=4.6.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "beautifulsoup4>=4.12.0",
    "python-dateutil>=2.8.0",
    "playwright>=1.48.0",
    "nltk>=3.8.1",
    "scikit-learn>=1.3.0",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.28.0",
]
dev = [
    "invoke>=2.2.0",
    "ruff>=0.1.0",
    "pre-commit>=3.5.0",
]

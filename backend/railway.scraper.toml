# railway.scraper.toml — EventLoop Scraper cron service
# Point Railway at this file via:
#   Service Settings → Config as Code path → /backend/railway.scraper.toml
# Docs: https://docs.railway.com/guides/config-as-code

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.scraper"

[deploy]
# Cron: every 6 hours. Edit in dashboard under service → Settings → Cron Schedule.
cronSchedule = "0 */6 * * *"
startCommand = "/app/.venv/bin/python /app/scripts/additive_scrape.py"
restartPolicyType = "never"

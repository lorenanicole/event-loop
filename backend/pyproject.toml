[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eventloop"
version = "0.1.0"
description = "AI-powered Chicago event discovery chatbot — Python 3.15"
readme = "README.md"
authors = [{name = "Lorena Mesa", email = "me@lorenamesa.com"}]
requires-python = ">=3.15"
dependencies = [
    "asyncpg>=0.32.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[project.optional-dependencies]
app = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.8.0",
    "pydantic-ai>=2.50.0",
    "anthropic>=0.45.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "httpx2>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "structlog>=24.1.0",
    "model2vec>=0.9.0",
    "numpy>=1.26.0",
]
parser = [
    "beautifulsoup4>=4.12.0",
    "playwright>=1.63.0",
    "httpx>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.28.0",
]
dev = [
    "invoke>=2.2.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "pre-commit>=3.5.0",
]
all = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.8.0",
    "pydantic-ai>=2.50.0",
    "anthropic>=0.45.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "anyio>=4.6.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "beautifulsoup4>=4.12.0",
    "python-dateutil>=2.8.0",
    "playwright>=1.63.0",
    # Static embeddings for semantic event search. Deliberately not
    # sentence-transformers: this has no torch dependency and encodes by
    # table lookup, so queries cost well under a millisecond on CPU.
    "model2vec>=0.9.0",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "structlog>=24.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = [
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "DTZ",  # flake8-datetimez (timezone-aware datetime)
    "E",    # pycodestyle errors
    "EXE",  # flake8-executable
    "F",    # pyflakes
    "G",    # flake8-logging-format
    "LOG",  # flake8-logging
    "PLW",  # pylint warnings
    "RUF",  # ruff-specific
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "W",    # pycodestyle warnings
]
ignore = [
    # FastAPI's Depends() / Query() / Header() in default arguments is the
    # framework's dependency-injection API, not a bug.
    "B008",
    # Broad except is deliberate throughout: resilience handlers, background
    # tasks, and lifespan hooks that must not crash the server.
    "BLE001",
    # Scripts are invoked via `python scripts/foo.py`, not chmod+executed.
    "EXE001",
    # f-string logging (G004) is the existing codebase convention throughout.
    # Converting 200+ log lines to %-style is a separate cleanup pass.
    "G004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE001", "RUF012", "DTZ", "E501"]
"src/app/chat/agent.py" = ["E501"]
"eval/**"  = ["S", "BLE001", "T20", "DTZ"]
"scripts/**" = ["S", "BLE001", "T20", "DTZ", "SIM115", "RUF005", "E501"]
# Scrapers construct naive datetimes intentionally: event dates are stored as
# local-midnight naive values throughout the database. Timezone-aware datetimes
# would require migrating the entire events table and all downstream comparisons.
# SIM/S rules: scraper resilience patterns (try-except-continue, try-except-pass,
# file:// URLs in geo data, etc.) are intentional; long lines in venue configs
# contain CSS selectors that cannot be split without breaking them.
"src/scrapers/**" = ["DTZ", "SIM", "S110", "S112", "S310", "E501", "RUF001", "PLW2901", "RUF012"]
# Pricing and enrichment use em-dashes in pattern strings deliberately (e.g. "$20–$25").
"src/shared/enrichment.py" = ["RUF001", "RUF003", "E501"]
"src/shared/pricing.py" = ["RUF001", "RUF003"]
# Geo loader opens local boundary files via file:// URL.
"src/shared/geo/chicago_neighborhoods.py" = ["S310"]

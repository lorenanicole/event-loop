[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eventloop"
version = "0.1.0"
description = "Multi-version AI Chat Bot for Real-time Chicago Event Discovery - Python 3.15 Backend + 3.14 Parser"
readme = "README.md"
authors = [{name = "Lorena Mesa", email = "me@lorenamesa.com"}]
requires-python = ">=3.14"

[tool.setuptools]
package-dir = {"" = "src"}

[project.optional-dependencies]
app = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.8.0",
    "pydantic-ai>=0.1.0",
    "anthropic>=0.45.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "structlog>=24.1.0",
]
parser = [
    "beautifulsoup4>=4.12.0",
    "playwright>=1.48.0",
    "httpx>=0.28.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.28.0",
]
dev = [
    "invoke>=2.2.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "pre-commit>=3.5.0",
]
all = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.8.0",
    "pydantic-ai>=0.1.0",
    "anthropic>=0.45.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "anyio>=4.6.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "beautifulsoup4>=4.12.0",
    "python-dateutil>=2.8.0",
    "playwright>=1.48.0",
    "nltk>=3.8.1",
    "scikit-learn>=1.3.0",
    # Static embeddings for semantic event search. Deliberately not
    # sentence-transformers: this has no torch dependency and encodes by
    # table lookup, so queries cost well under a millisecond on CPU.
    "model2vec>=0.9.0",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "structlog>=24.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "app/tests", "parser/tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py314"
